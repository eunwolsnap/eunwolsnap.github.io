<style>
  /* Layout: one quiet column, centred block, two full-width links — matches the white minimal homepage */
  :root {
    --bg: #FFFFFF;
    --ink: #121212;
    --muted: #7A7A7A;
    --line: #E6E6E6;
    --hush: #BDBDBD;
    --font-display: "Inter", "Noto Sans KR", system-ui, sans-serif;
    --font-body: "Noto Sans KR", "Inter", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    padding-block: 64px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  header { display: grid; gap: 14px; justify-items: center; text-align: center; }
  .mark { margin: 0; line-height: 0; }
  .mark img { height: 40px; width: auto; max-width: 100%; display: block; }
  .motto { margin: 0; font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-weight: 400; font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; }
  nav { width: 100%; max-width: 360px; display: grid; gap: 12px; }
  a.link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 22px;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--ink);
    text-decoration: none;
    transition: border-color .2s ease, background-color .2s ease;
  }
  a.link:hover { border-color: var(--ink); }
  a.link:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  a.link.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  a.link.primary:hover { background: #2a2a2a; }
  .label { display: grid; gap: 3px; min-width: 0; }
  .label strong { font-weight: 400; font-size: 15px; }
  .label span { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); }
  a.link.primary .label span { color: var(--hush); }
  .arrow { font-family: var(--font-display); font-weight: 200; font-size: 18px; }
  footer {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: lowercase;
    color: var(--hush);
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) { a.link { transition: none; } }
</style>
